<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nothing to see here</title>
    <style>
        body {
            background-color: #0d0f12;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        /* Das animierte Auge */
        .eye {
            width: 120px;
            height: 80px;
            background-color: transparent;
            border: 4px solid #00ff66;
            border-radius: 50% 0;
            transform: rotate(45deg);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: blink 4s infinite ease-in-out;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            margin-bottom: 30px;
        }

        .pupil {
            width: 35px;
            height: 35px;
            background-color: #00ff66;
            border-radius: 50%;
            transform: rotate(-45deg);
            box-shadow: 0 0 10px #00ff66;
        }

        /* Blinzel-Animation */
        @keyframes blink {
            0%, 90%, 100% {
                transform: rotate(45deg) scaleY(1);
            }
            95% {
                transform: rotate(45deg) scaleY(0.05);
            }
        }

        h1 {
            font-size: 24px;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        p {
            font-size: 16px;
            opacity: 0.8;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="eye">
        <div class="pupil"></div>
    </div>

    <h1>[ ERROR 404: SITE_NOT_FOUND ]</h1>
    <p>> Nothing to see here... we are watching you.</p>

</body>
</html>
