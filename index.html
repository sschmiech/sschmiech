    <style>
        body {
            background-color: #050505;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
        }

        /* Das markante, dicke Anime-Auge */
        .eye {
            width: 170px;
            height: 95px;
            background-color: #ffffff; 
            border: 8px solid #000000;
            outline: 4px solid #990000; 
            border-radius: 75% 0;
            transform: rotate(45deg);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.4);
            margin-bottom: 40px;
            overflow: hidden;
            animation: sharinganWakeUp 7s infinite ease-in-out;
        }

        /* Die rote Mangekyō Iris */
        .iris {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ff5500 0%, #cc0000 70%, #440000 100%);
            border: 3px solid #000000;
            border-radius: 50%;
            transform: rotate(-45deg);
            position: relative;
            box-shadow: 0 0 15px #ff3333;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pupilScale 7s infinite ease-in-out;
        }

        /* Die 3 komplexen Klingen des Mangekyō (über CSS-Pfade generiert) */
        .blade {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .blade::before {
            content: '';
            position: absolute;
            width: 12px;
            height: 38px;
            background-color: #000000;
            /* Erzeugt die geschwungene, sichelförmige Klinge */
            border-radius: 100% 0% 50% 50% / 40% 0% 100% 60%;
            transform: translateY(-16px) rotate(-15deg);
        }

        /* Rotation der drei einzelnen Klingen um das Zentrum */
        .b1 { transform: rotate(0deg); }
        .b2 { transform: rotate(120deg); }
        .b3 { transform: rotate(240deg); }

        /* Die tiefschwarze Pupille im Zentrum */
        .pupil-center {
            width: 20px;
            height: 20px;
            background-color: #000000;
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Animations-Ablauf: Verbleibt extrem flach gedrückt (schwarzer Strich), klappt dann mächtig auf */
        @keyframes sharinganWakeUp {
            0%, 30% {
                transform: rotate(45deg) scaleY(0.02);
                background-color: #000000; 
            }
            42%, 80% {
                transform: rotate(45deg) scaleY(1);
                background-color: #ffffff;
            }
            84% {
                transform: rotate(45deg) scaleY(0.02);
                background-color: #000000;
            }
            88%, 94% {
                transform: rotate(45deg) scaleY(1);
                background-color: #ffffff;
            }
            100% {
                transform: rotate(45deg) scaleY(0.02);
                background-color: #000000;
            }
        }

        /* Verhindert Verzerrungen der Iris im geschlossenen Zustand */
        @keyframes pupilScale {
            0%, 30%, 84%, 100% {
                transform: rotate(-45deg) scale(0);
            }
            42%, 80%, 88%, 94% {
                transform: rotate(-45deg) scale(1);
            }
        }

        h1 {
            font-size: 26px;
            margin: 10px 0;
            letter-spacing: 3px;
            color: #ff3333;
        }

        p {
            font-size: 16px;
            color: #ff9999;
            opacity: 0.9;
            animation: textPulse 2s infinite alternate;
        }

        @keyframes textPulse {
            from { opacity: 0.6; text-shadow: 0 0 5px rgba(255, 51, 51, 0.4); }
            to { opacity: 1; text-shadow: 0 0 15px rgba(255, 51, 51, 0.9); }
        }
    </style>
</head>
<body>

    <div class="eye">
        <div class="iris">
            <div class="blade b1"></div>
            <div class="blade b2"></div>
            <div class="blade b3"></div>
            <div class="pupil-center"></div>
        </div>
    </div>
