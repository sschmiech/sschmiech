<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nothing to see here</title>
    <style>
        body {
            background-color: #050505;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Roter, düsterer Glow-Effekt für die Schrift */
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
        }

        /* Das markante, dicke Anime-Auge */
        .eye {
            width: 160px;
            height: 90px;
            background-color: #ffffff; /* Weißer Augapfel wie im Bild */
            /* Sehr dicke, schwarze Konturlinien */
            border: 8px solid #000000;
            outline: 4px solid #990000; /* Dunkelrote Außen-Silhouette */
            border-radius: 75% 0;
            transform: rotate(45deg);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            margin-bottom: 40px;
            overflow: hidden;
            /* Animation für das versetzte Öffnen */
            animation: sharinganWakeUp 7s infinite ease-in-out;
        }

        /* Große, bedrohliche Sharingan-Iris */
        .pupil {
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, #ff6600 0%, #cc0000 70%, #000000 100%);
            border: 4px solid #000000;
            border-radius: 50%;
            transform: rotate(-45deg);
            position: relative;
            box-shadow: 0 0 15px #ff3333;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pupilScale 7s infinite ease-in-out;
        }

        /* Die typischen schwarzen Tomoe-/Sharingan-Muster im Auge */
        .pupil::before {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #000000;
            border-radius: 50%;
            /* Simuliert die innere schwarze Struktur */
            box-shadow: 0 0 0 6px rgba(0,0,0,0.2);
        }

        /* Animations-Ablauf: Lange geschlossen (nur dicker Strich), geht dann mächtig auf */
        @keyframes sharinganWakeUp {
            0%, 25% {
                /* Startet komplett flach gedrückt -> wirkt wie eine dicke Linie */
                transform: rotate(45deg) scaleY(0.02);
                background-color: #000000; /* Versteckt das Weiß im geschlossenen Zustand */
            }
            35%, 80% {
                /* Öffnet sich weit und fixiert den Betrachter */
                transform: rotate(45deg) scaleY(1);
                background-color: #ffffff;
            }
            84% {
                /* Ein schnelles, bedrohliches Blinzeln */
                transform: rotate(45deg) scaleY(0.02);
                background-color: #000000;
            }
            88%, 94% {
                /* Wieder offen */
                transform: rotate(45deg) scaleY(1);
                background-color: #ffffff;
            }
            100% {
                /* Schließt sich schwerfällig am Ende */
                transform: rotate(45deg) scaleY(0.02);
                background-color: #000000;
            }
        }

        /* Schützt die Iris vor Verzerrungen, wenn das Auge eine Linie ist */
        @keyframes pupilScale {
            0%, 25%, 84%, 100% {
                transform: rotate(-45deg) scale(0);
            }
            35%, 80%, 88%, 94% {
                transform: rotate(-45deg) scale(1);
            }
        }

        h1 {
            font-size: 26px;
            margin: 10px 0;
            letter-spacing: 3px;
            color: #ff3333;
        }

        p {
            font-size: 16px;
            color: #ff9999;
            opacity: 0.9;
            animation: textPulse 2s infinite alternate;
        }

        @keyframes textPulse {
            from { opacity: 0.6; text-shadow: 0 0 5px rgba(255, 51, 51, 0.4); }
            to { opacity: 1; text-shadow: 0 0 15px rgba(255, 51, 51, 0.9); }
        }
    </style>
</head>
<body>

    <div class="eye">
        <div class="pupil"></div>
    </div>

    <h1>[ ERROR 404: SITE_NOT_FOUND ]</h1>
    <p>> Nothing to see here... we are watching you.</p>

</body>
</html>
